name: sync publications

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch deploy.yml below

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script is stdlib-only, so there is nothing to install.
      - name: Sync papers.bib 📚
        run: python3 bin/sync-publications.py --verbose | tee /tmp/report.txt

      - name: Commit to master 📌
        id: commit
        run: |
          if git diff --quiet -- _bibliography/papers.bib; then
            echo "papers.bib unchanged; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "chore: sync papers.bib with ORCID + Semantic Scholar"
            echo
            cat /tmp/report.txt
          } > /tmp/message.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git commit -F /tmp/message.txt
          git pull --rebase --autostash origin master
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy 🚀
        if: steps.commit.outputs.changed == 'true'
        run: |
          # A push authenticated with GITHUB_TOKEN deliberately does not trigger
          # other workflows, so deploy.yml would never fire on the commit above
          # and the live site would silently stay stale. Dispatch it explicitly.
          curl -sS --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"master"}'

      - name: Preview image reminder 🖼️
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Entries added automatically have no preview image; the report names them.
          grep -A20 "add a preview image" /tmp/report.txt >> "$GITHUB_STEP_SUMMARY" || \
            echo "No new entries needed a preview image." >> "$GITHUB_STEP_SUMMARY"
